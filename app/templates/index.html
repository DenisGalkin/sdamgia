<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f3">
    <meta name="description" content="Extract answers from an SDAMGIA test variant.">
    <title>SDAMGIA Answers</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <main>
      <h1>SDAMGIA Answers</h1>
      <form id="answer-form">
        <label class="sr-only" for="test-number">Test number</label>
        <input id="test-number" name="test-number" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="12" placeholder="Test number" autocomplete="off" required autofocus>
        <button id="submit-button" type="submit">Get answers</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <section id="results" aria-label="Answers" hidden>
        <div id="answer-list"></div>
        <button id="copy-button" class="secondary" type="button">Copy</button>
      </section>
    </main>
  </body>
</html>
